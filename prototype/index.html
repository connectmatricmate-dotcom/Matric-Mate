<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatricMate — Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#096A8B; --teal-d:#0F5064; --teal-t:#E9F2F5; --teal-t2:#D5E7ED;
  --ink:#0F3D4C; --ink2:#517682; --ink3:#8AA4AD;
  --paper:#FAFBF7; --card:#FFFFFF; --line:#E4EAE6;
  --orange:#F29329; --orange-d:#D97B10; --orange-t:#FDF1E1;
  --green:#2E9E5B; --green-t:#E7F5EC; --red:#D9534F; --red-t:#FBECEB;
  --disp:'Baloo 2',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ur:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif;
  --sh:0 6px 20px rgba(15,80,100,.07);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
svg:not([width]){width:20px;height:20px;flex:none}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:#EDF1EE;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#C9D6D2;border-radius:8px}

/* ---------- viewer chrome ---------- */
#viewer{display:grid;grid-template-columns:284px 1fr 316px;height:100vh}
#nav{background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 40px}
#nav .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
#nav .brand img{height:30px}
#nav .brand small{display:block;color:var(--ink2);font-size:11px;font-weight:600}
#nav .grp{margin-top:14px}
#nav .grp>h4{font-family:var(--disp);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:0 8px 6px;display:flex;justify-content:space-between;align-items:center}
#nav .grp>h4 .m{font-size:10px;background:var(--teal-t);color:var(--teal);border-radius:99px;padding:2px 8px;letter-spacing:0}
#nav a{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:600}
#nav a:hover{background:var(--paper)}
#nav a.on{background:var(--teal);color:#fff}
#nav a .n{color:var(--ink3);font-size:11px;font-weight:700;width:18px;flex:none}
#nav a.on .n{color:rgba(255,255,255,.7)}
#stage{display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#notes{background:var(--card);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 40px}
#notes h3{font-family:var(--disp);font-size:17px;margin-bottom:2px}
#notes .m{display:inline-block;font-size:11px;font-weight:800;background:var(--orange-t);color:var(--orange-d);border-radius:99px;padding:2px 9px;margin:4px 0 10px}
#notes ul{list-style:none;display:grid;gap:8px;margin-top:8px}
#notes li{font-size:13px;line-height:1.5;color:var(--ink);padding-left:14px;position:relative}
#notes li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:99px;background:var(--teal)}
#notes .hint{margin-top:16px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--ink2);line-height:1.5}

/* ---------- phone frame ---------- */
#phonewrap{transform-origin:center center}
.phone{width:390px;height:844px;background:#0B2E3A;border-radius:52px;padding:10px;box-shadow:0 30px 80px rgba(15,80,100,.35)}
.phone-in{position:relative;width:100%;height:100%;background:var(--paper);border-radius:42px;overflow:hidden}
.sbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:800;z-index:40;pointer-events:none}
.sbar .pill-notch{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:110px;height:26px;background:#0B2E3A;border-radius:99px}
.sbar svg{width:17px;height:17px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:44px}
.scr.dark{background:var(--teal-d)}
.body{flex:1;overflow-y:auto;padding:8px 18px 24px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body.pad0{padding:0}
.gesture{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:99px;background:rgba(15,80,100,.25);z-index:40;pointer-events:none}

/* ---------- desktop frame ---------- */
#deskwrap{display:none;transform-origin:center center}
.deskframe{width:1240px;background:#0B2E3A;border-radius:18px;padding:8px;box-shadow:0 30px 80px rgba(15,80,100,.3)}
.desk-chrome{display:flex;align-items:center;gap:8px;padding:6px 10px 10px}
.desk-chrome i{width:11px;height:11px;border-radius:99px;background:#3F6675;display:inline-block}
.desk-chrome .url{flex:1;background:#123C4A;color:#9FC0CB;border-radius:8px;font-size:12px;padding:5px 12px;font-weight:600}
.desk-in{position:relative;height:780px;background:var(--paper);border-radius:10px;overflow:hidden}
.desk-body{position:absolute;inset:0;overflow-y:auto}

/* ---------- shared app components ---------- */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 18px 6px;min-height:52px}
.hdr .tt{font-family:var(--disp);font-size:20px;font-weight:700;flex:1;line-height:1.2}
.hdr .sub{font-size:12px;color:var(--ink2);font-weight:700}
.icb{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);flex:none;position:relative}
.icb svg{width:20px;height:20px}
.icb.plain{background:none;border:0}
.icb .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:99px;background:var(--orange);border:2px solid var(--paper)}
.ava{width:40px;height:40px;border-radius:14px;background:var(--orange-t);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;border:1px solid var(--line)}
.tabbar{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(10px + 8px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:var(--ink3);padding:5px 0;border-radius:12px}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.card.flat{box-shadow:none}
.stit{font-family:var(--disp);font-size:15px;font-weight:700;margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.stit a{font-size:12px;color:var(--teal);text-decoration:none;font-weight:800}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;font-family:var(--disp);font-size:16px;font-weight:700;background:var(--teal);color:#fff}
.btn svg{width:18px;height:18px}
.btn.orange{background:var(--orange);color:#fff}
.btn.ghost{background:none;color:var(--teal)}
.btn.line{background:var(--card);border:1.5px solid var(--teal-t2);color:var(--teal)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px;width:auto}
.btn:disabled{opacity:.4}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:99px;padding:4px 10px;background:var(--teal-t);color:var(--teal)}
.pill.or{background:var(--orange-t);color:var(--orange-d)}
.pill.gr{background:var(--green-t);color:var(--green)}
.pill.rd{background:var(--red-t);color:var(--red)}
.pill.gy{background:#EFF3F0;color:var(--ink2)}
.pill svg{width:12px;height:12px}
.seg{display:flex;background:#EFF3F0;border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-size:13px;font-weight:800;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--teal);box-shadow:0 1px 4px rgba(15,80,100,.12)}
.inp{margin-bottom:12px}
.inp label{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.inp .f{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;color:var(--ink)}
.inp .f svg{width:18px;height:18px;color:var(--ink3);flex:none}
.inp .f i{font-style:normal;color:var(--ink3);margin-left:auto}
.inp .f.focus{border-color:var(--teal)}
.item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:42px;height:42px;border-radius:13px;background:var(--teal-t);display:flex;align-items:center;justify-content:center;flex:none;font-size:20px}
.item .ic svg{width:20px;height:20px;color:var(--teal)}
.item .ic.or{background:var(--orange-t)} .item .ic.or svg{color:var(--orange-d)}
.item b{display:block;font-size:14.5px;font-weight:800}
.item small{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:1px}
.item .mid{flex:1;min-width:0}
.item .chev{color:var(--ink3)}.item .chev svg{width:18px;height:18px}
.bar{height:7px;background:#EAF0EC;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--orange)}
.bar.tl i{background:var(--teal)}
.opt{display:flex;align-items:center;gap:11px;background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:10px;font-size:14.5px;font-weight:700;text-align:left;width:100%}
.opt .k{width:26px;height:26px;border-radius:9px;background:#EFF3F0;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex:none}
.opt.sel{border-color:var(--teal);background:var(--teal-t)}
.opt.sel .k{background:var(--teal);color:#fff}
.opt.ok{border-color:var(--green);background:var(--green-t)} .opt.ok .k{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-t)} .opt.bad .k{background:var(--red);color:#fff}
.footcta{padding:10px 18px 14px;background:linear-gradient(transparent,var(--paper) 40%)}
.ur{font-family:var(--ur);direction:rtl;line-height:2.1}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.center{text-align:center}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:10px 16px;border-radius:99px;opacity:0;transition:opacity .2s;z-index:60;white-space:nowrap}
.toast.show{opacity:1}
.lockrow{filter:grayscale(.2);opacity:.62}
.sheetback{position:absolute;inset:0;background:rgba(11,46,58,.45);z-index:50;display:flex;align-items:flex-end;border-radius:42px}
.sheet{background:var(--paper);width:100%;border-radius:26px 26px 0 0;padding:10px 18px 26px;max-height:78%;overflow-y:auto}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:#C9D6D2;margin:4px auto 12px}
.skel{background:linear-gradient(90deg,#EAF0EC 25%,#F4F8F5 50%,#EAF0EC 75%);background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
.flame{display:inline-flex;animation:fl 1.6s ease-in-out 2}
@keyframes fl{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.pkm{display:flex;gap:8px;margin:6px 0 12px}
.pkm button{flex:1;padding:10px 6px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font-size:12.5px;font-weight:800;color:var(--ink2)}
.pkm button.on{border-color:var(--orange);background:var(--orange-t);color:var(--orange-d)}
.fcard{perspective:1200px;height:340px}
.fcard .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.fcard.flip .in{transform:rotateY(180deg)}
.fcard .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;border-radius:22px}
.fcard .front{background:var(--card);border:1.5px solid var(--line);box-shadow:var(--sh)}
.fcard .back{background:var(--teal);color:#fff;transform:rotateY(180deg)}
.chat{display:grid;gap:12px}
.msg{max-width:82%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.55;font-weight:600}
.msg.me{background:var(--teal);color:#fff;justify-self:end;border-bottom-right-radius:6px}
.msg.ai{background:var(--card);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:6px}
.msg .step{display:flex;gap:8px;margin-top:8px;font-size:13.5px}
.msg .step b{flex:none;width:20px;height:20px;border-radius:99px;background:var(--teal-t);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:11px}
.typing i{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--ink3);margin-right:3px;animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi b{font-family:var(--disp);font-size:22px;display:block}
.kpi small{font-size:11.5px;color:var(--ink2);font-weight:700}
.dial{position:relative;width:150px;height:150px;margin:0 auto}
.dial svg{transform:rotate(-90deg)}
.dial .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp)}
.dial .v b{font-size:30px}
.dial .v small{font-size:12px;color:var(--ink2);font-weight:700}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:45}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:cf 1.6s ease-in forwards}
@keyframes cf{to{transform:translateY(880px) rotate(540deg);opacity:.1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- web/admin inner layouts ---------- */
.wshell{display:grid;grid-template-columns:224px 1fr;min-height:780px}
.wside{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.wside img{height:26px;align-self:flex-start;margin:0 8px 14px}
.wside a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:11px;font-size:13.5px;font-weight:800;color:var(--ink2);text-decoration:none}
.wside a svg{width:18px;height:18px}
.wside a.on{background:var(--teal-t);color:var(--teal)}
.wside .sp{flex:1}
.wmain{padding:22px 26px;max-width:1040px}
.wtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.wtop .srch{flex:1;max-width:380px;display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 13px;font-size:13px;color:var(--ink3);font-weight:600}
.wtop .srch svg{width:16px;height:16px}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);text-align:left;padding:10px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);font-weight:600}
.tbl tr:last-child td{border-bottom:0}

/* ---------- mobile viewing ---------- */
#fabs{display:none}
@media (max-width:920px){
  #viewer{grid-template-columns:1fr}
  #nav,#notes{display:none}
  #stage{height:100vh;height:100dvh}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .phone-in{border-radius:0}
  .sbar .pill-notch{display:none}
  #fabs{display:flex;position:fixed;right:14px;bottom:90px;flex-direction:column;gap:10px;z-index:90}
  #fabs button{width:46px;height:46px;border-radius:99px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(15,80,100,.35)}
  #fabs button svg{width:20px;height:20px}
  #msheet{position:fixed;inset:0;background:rgba(11,46,58,.5);z-index:100;display:none;align-items:flex-end}
  #msheet.show{display:flex}
  #msheet>div{background:var(--paper);width:100%;max-height:76vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px}
  .deskframe{width:1240px}
}
</style>
</head>
<body>
<div id="viewer">
  <aside id="nav">
    <div class="brand"><img id="brandimg" alt="MatricMate"><div><small>Clickable prototype · v1</small><small id="cnt"></small></div></div>
    <div id="navlist"></div>
  </aside>
  <main id="stage">
    <div id="phonewrap">
      <div class="phone"><div class="phone-in" id="phone-in">
        <div class="sbar"><span>9:41</span><span class="pill-notch"></span><span style="display:flex;gap:5px;align-items:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 4v16"/></svg><svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="18" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="9" width="12" height="6" rx="1"/><path d="M22 10v4"/></svg></span></div>
        <div id="scrhost"></div>
        <div class="gesture"></div>
        <div class="toast" id="toast"></div>
      </div></div>
    </div>
    <div id="deskwrap">
      <div class="deskframe">
        <div class="desk-chrome"><i></i><i></i><i></i><div class="url" id="deskurl">matricmate.pk</div></div>
        <div class="desk-in"><div class="desk-body" id="deskhost"></div></div>
      </div>
    </div>
  </main>
  <aside id="notes"><div id="notebody"></div></aside>
</div>
<div id="fabs">
  <button id="fab-list" aria-label="All screens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <button id="fab-note" aria-label="Screen notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
</div>
<div id="msheet"><div id="msheet-in"></div></div>

const REG=[]; const BYID={};
function scr(id,group,title,kind,m,note,fn){const s={id,group,title,kind,m,note,fn};REG.push(s);BYID[id]=s}
let CUR=null, HIST=[];
function go(id,push=true){const s=BYID[id];if(!s)return;if(push&&CUR)HIST.push(CUR.id);CUR=s;
 const ph=document.getElementById('phonewrap'),dw=document.getElementById('deskwrap');
 if(s.kind==='desk'){ph.style.display='none';dw.style.display='block';document.getElementById('deskhost').innerHTML=s.fn();document.getElementById('deskurl').textContent=s.url||'matricmate.pk';}
 else{ph.style.display='block';dw.style.display='none';document.getElementById('scrhost').innerHTML='<div class="scr'+(s.darkbar?' dark':'')+'">'+s.fn()+'</div>';}
 history.replaceState(null,'','#'+id);
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
 const on=document.querySelector('#nav a.on');if(on)on.scrollIntoView({block:'nearest'});
 renderNote(s); fit(); if(s.after)s.after();
}
function back(){const p=HIST.pop();if(p)go(p,false)}
function renderNote(s){document.getElementById('notebody').innerHTML=
 '<h3>'+s.title+'</h3><span class="m">Ships in '+s.m+'</span><ul>'+s.note.map(n=>'<li>'+n+'</li>').join('')+'</ul>'+
 '<div class="hint">Prototype only — data is sample FBISE Class 9 content. Tap anything highlighted; every screen is reachable from the index. Spec: docs/DESIGN-SPEC.md.</div>'}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600)}

 (o.back?'<button class="icb plain" data-back>'+ic('back')+'</button>':'')+
 '<div style="flex:1;min-width:0"><div class="tt">'+t+'</div>'+(o.sub?'<div class="sub">'+o.sub+'</div>':'')+'</div>'+
 (o.right||'')+'</div>'}
const TABS=[['dash','home','Home'],['subjects','book','Study'],['practice','target','Practice'],['ai-home','spark','AI Tutor'],['prog','chart','Progress']];

function item(o){return '<div class="item'+(o.lock?' lockrow':'')+'" '+(o.go?'data-go="'+o.go+'"':'')+' style="cursor:pointer">'+
 (o.emoji?'<div class="ic'+(o.or?' or':'')+'">'+o.emoji+'</div>':o.icn?'<div class="ic'+(o.or?' or':'')+'">'+ic(o.icn)+'</div>':'')+

function buildNav(){const groups=[];REG.forEach(s=>{let g=groups.find(x=>x.n===s.group);if(!g){g={n:s.group,items:[]};groups.push(g)}g.items.push(s)});
 document.getElementById('navlist').innerHTML=groups.map(g=>'<div class="grp"><h4>'+g.n+'<span class="m">'+g.items.length+'</span></h4>'+
 g.items.map((s,i)=>'<a href="#'+s.id+'" data-id="'+s.id+'"><span class="n">'+(i+1)+'</span>'+s.title+'</a>').join('')+'</div>').join('');
 document.getElementById('cnt').textContent=REG.length+' screens · tap to explore';
 document.getElementById('brandimg').src=IMG.word;}
function fit(){const st=document.getElementById('stage'),ph=document.getElementById('phonewrap'),dw=document.getElementById('deskwrap');
 const w=st.clientWidth-40,h=st.clientHeight-40;
 if(matchMedia('(max-width:920px)').matches){ph.style.transform='none';dw.style.transform='scale('+Math.min(1,(innerWidth-16)/1240)+')';return}
 ph.style.transform='scale('+Math.min(1,h/864,w/410)+')';
 dw.style.transform='scale('+Math.min(1,w/1260,h/840)+')';}
addEventListener('resize',fit);
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
 if(e.target.closest('[data-back]')){back();return}
 const t=e.target.closest('[data-toast]');if(t){toast(t.dataset.toast);return}
 const sl=e.target.closest('[data-slide]');if(sl){wIdx=+sl.dataset.slide;go('welcome',false);return}
 const na=e.target.closest('#nav a');if(na){e.preventDefault();HIST=[];go(na.dataset.id);return}
 const op=e.target.closest('[data-opt]');if(op){document.querySelectorAll('[data-opt]').forEach(o=>o.classList.remove('sel'));op.classList.add('sel');const pw=document.getElementById('pkwrap');if(pw)pw.style.display='block';return}
 const pk=e.target.closest('[data-pk]');if(pk){document.querySelectorAll('[data-pk]').forEach(o=>o.classList.remove('on'));pk.classList.add('on');const cb=document.getElementById('checkbtn');if(cb)cb.disabled=false;return}
 if(e.target.closest('#fcard')){document.getElementById('fcard').classList.toggle('flip');return}
 if(e.target.closest('#fab-list')){const ms=document.getElementById('msheet');document.getElementById('msheet-in').innerHTML=document.getElementById('navlist').innerHTML;ms.classList.add('show');return}
 if(e.target.closest('#fab-note')){const ms=document.getElementById('msheet');document.getElementById('msheet-in').innerHTML=document.getElementById('notebody').innerHTML;ms.classList.add('show');return}
 if(e.target.id==='msheet'){e.target.classList.remove('show');return}
 const ma=e.target.closest('#msheet a');if(ma){e.preventDefault();document.getElementById('msheet').classList.remove('show');HIST=[];go(ma.dataset.id);return}
});
buildNav();
go((location.hash||'#splash').slice(1)||'splash',false);
